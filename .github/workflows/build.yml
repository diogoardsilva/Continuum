name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: dotnet build Continuum.sln -c Release

      - name: Test
        run: dotnet test tests/Continuum.Core.Tests -c Release

      # go-ios talks to the iPhone over USB (tunnel, developer image, WebDriverAgent).
      - name: Build go-ios
        shell: pwsh
        env:
          GOFLAGS: ''
        run: |
          go install github.com/danielpaulus/go-ios@v1.3.2
          New-Item -ItemType Directory -Force publish/Continuum-USB | Out-Null
          Copy-Item "$(go env GOPATH)/bin/go-ios.exe" publish/Continuum-USB/ios.exe
          Copy-Item usb/test-wda.ps1, usb/test-wda.cmd publish/Continuum-USB/
          Compress-Archive publish/Continuum-USB/* publish/Continuum-USB-win-x64.zip

      - name: Publish
        shell: pwsh
        run: |
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true')
          dotnet publish src/Continuum/Continuum.csproj @common -o publish/Continuum
          dotnet publish tools/BtHidProbe/BtHidProbe.csproj @common -o publish/BtHidProbe
          dotnet publish tools/ContactsTool/ContactsTool.csproj @common -o publish/ContactsTool
          Copy-Item publish/ContactsTool/Continuum.Contactos.exe publish/Continuum.Contactos.exe
          Compress-Archive publish/Continuum/* publish/Continuum-win-x64.zip
          Copy-Item publish/BtHidProbe/Continuum.BtHidProbe.exe publish/Continuum.BtHidProbe.exe

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-win-x64
          path: |
            publish/Continuum-win-x64.zip
            publish/Continuum.BtHidProbe.exe
            publish/Continuum.Contactos.exe
            publish/Continuum-USB-win-x64.zip

  airplay:
    runs-on: windows-latest
    env:
      # UxPlay master with the built-in mDNS (no Bonjour SDK needed).
      UXPLAY_REF: 534e2cc0e558d6c94bcc66964f8fc13ad73a6cdc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Fetch UxPlay
        run: |
          git init -q uxplay
          git -C uxplay fetch -q --depth 1 https://github.com/FDH2/UxPlay "$UXPLAY_REF"
          git -C uxplay checkout -q FETCH_HEAD

      - name: Build and bundle
        run: |
          scripts/bundle-uxplay.sh uxplay publish/Continuum-AirPlay

      - name: Zip
        shell: pwsh
        run: Compress-Archive publish/Continuum-AirPlay publish/Continuum-AirPlay-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-airplay-win-x64
          path: publish/Continuum-AirPlay-win-x64.zip

  wda:
    runs-on: macos-latest
    steps:
      - name: Fetch WebDriverAgent
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/appium/WebDriverAgent 'v*' \
                | awk -F/ '{print $3}' | sort -V | tail -1)
          echo "WebDriverAgent $tag"
          git clone -q --depth 1 --branch "$tag" https://github.com/appium/WebDriverAgent wda

      # Unsigned device build; it gets signed on Windows with the user's Apple ID.
      - name: Build unsigned runner
        working-directory: wda
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -20

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R wda/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app dist/Payload/
          ls dist/Payload/WebDriverAgentRunner-Runner.app/Frameworks dist/Payload/WebDriverAgentRunner-Runner.app/PlugIns
          (cd dist && zip -qry ../WebDriverAgent-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: webdriveragent-unsigned
          path: WebDriverAgent-unsigned.ipa

  icloud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build bridges
        shell: pwsh
        run: |
          pip install -r bridge/requirements.txt
          pyinstaller --onefile --console --name Continuum.iCloud `
            --collect-all pyicloud --collect-data certifi --collect-data fido2 `
            --distpath publish bridge/continuum_icloud.py
          pyinstaller --onefile --console --name Continuum.iPhone `
            --collect-all pymobiledevice3 --collect-data certifi `
            --distpath publish bridge/continuum_iphone.py
          ./publish/Continuum.iCloud.exe --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Continuum.iCloud.exe failed to start"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-bridges-win-x64
          path: |
            publish/Continuum.iCloud.exe
            publish/Continuum.iPhone.exe

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, airplay, wda, icloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Rolling pre-release so the latest main build is always one click away.
      - name: Update dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "Versão de desenvolvimento" \
            --notes "Compilação automática do último commit em main ($GITHUB_SHA)." \
            dist/*
